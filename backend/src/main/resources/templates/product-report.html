<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:td="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <style>

        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #333;
        }

        .container {
            padding: 20px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .date {
            font-size: 11px;
            color: #777;
        }

        /* INFO */
        .info {
            display: inline-block;
            width: 100%;
            margin-top: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f5f5f5;
        }

        th {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 12px;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        /* FOOTER */
        .footer {
            margin-top: 30px;
            font-size: 10px;
            text-align: center;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="title">Relatório de Produtos</div>
        <div class="date"
             th:text="${#temporals.format(now, 'dd/MM/yyyy HH:mm')}">
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Descrição</th>
            <th>Preço</th>
            <th>Quant.</th>
            <th>U.M.</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prod : ${products}">
            <td th:text="${prod.code}"></td>

            <td style="text-align: left;" th:text="${prod.name}"></td>

            <td th:text="${T(java.lang.String).format(new java.util.Locale('pt', 'BR'), '%.2f', prod.price)}"></td>

            <td th:text="${T(java.lang.String).format(new java.util.Locale('pt', 'BR'), '%.2f', prod.totalQuantity)}"></td>

            <td th:text="${prod.unitMeasure}"></td>

            <td th:text="${prod.stockStatus.getDescription()}"></td>

        </tr>
        </tbody>
    </table>

    <!-- FILTROS -->
    <div class="info">
            <span>
                <strong>Total de registros:</strong>
                <span th:text="${products.size()}"></span>
            </span>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Gerado automaticamente pelo sistema de estoque
    </div>
</div>
</body>
</html>
